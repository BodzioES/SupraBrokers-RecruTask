<!doctype html>
{% load static %}
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in — SupraBrokers</title><!-- SYNC-TEST -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='12' fill='%230d6efd'/%3E%3Ccircle cx='12' cy='9' r='4' fill='white'/%3E%3Cpath d='M4 20c1.5-4 5-5.5 8-5.5s6.5 1.5 8 5.5' stroke='white' stroke-width='2.5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
  <script>
    (function () {
      try {
        document.documentElement.setAttribute(
          'data-bs-theme', localStorage.getItem('sb-theme') || 'light'
        );
      } catch (e) {}
    })();
  </script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{% static 'contacts/css/theme.css' %}?v=6" rel="stylesheet">
</head>
<body class="bg-body-tertiary">
<main class="container">
  <div class="row justify-content-center" style="margin-top: 12vh;">
    <div class="col-12 col-md-6 col-lg-4">
      <div class="card shadow">
        <div class="card-body p-4">
          <h1 class="h4 mb-1 text-center">SupraBrokers</h1>
          <p class="text-muted small text-center">No registration. Ask an admin to create your account.</p>
          <form method="post">
            {% csrf_token %}
            {% if form.non_field_errors %}
            <div class="alert alert-danger">{{ form.non_field_errors }}</div>
            {% endif %}
            <div class="mb-3">
              <label class="form-label" for="{{ form.username.id_for_label }}">Username</label>
              <input type="text" name="username" id="{{ form.username.id_for_label }}"
                     class="form-control" autocomplete="username" required autofocus>
            </div>
            <div class="mb-3">
              <label class="form-label" for="{{ form.password.id_for_label }}">Password</label>
              <input type="password" name="password" id="{{ form.password.id_for_label }}"
                     class="form-control" autocomplete="current-password" required>
            </div>
            {% if next %}
            <input type="hidden" name="next" value="{{ next }}">
            {% endif %}
            <button type="submit" class="btn btn-primary w-100">Log in</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
