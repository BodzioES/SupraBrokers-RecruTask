{% extends 'base.html' %}

{% block title %}Delete contact — SupraBrokers{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-6">
    <div class="card shadow-sm border-danger">
      <div class="card-body">
        <h1 class="h4 mb-3"><i class="bi bi-trash"></i> Delete contact</h1>
        <p>Are you sure you want to delete <strong>{{ object }}</strong>?</p>
        <form method="post">
          {% csrf_token %}
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-danger">Yes, delete</button>
            <a href="{% url 'contacts:list' %}" class="btn btn-outline-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
